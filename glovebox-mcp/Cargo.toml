[package]
name = "glovebox-mcp"
edition.workspace = true
version.workspace = true

[lib]
name = "glovebox_mcp"
path = "src/lib.rs"

[[bin]]
name = "glovebox-mcp"
path = "src/main.rs"

[dependencies]
glovebox-shared = { path = "../glovebox-shared" }
rmcp = { version = "3.9", features = [
    "server",
    "macros",
    "transport-io",
    "schemars",
] }
schemars = "1.2"
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
glovebox-shared = { path = "../glovebox-shared", features = ["test-support"] }
rmcp = { version = "3.9", features = ["client"] }
tempfile = "3"
