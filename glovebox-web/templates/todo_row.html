<li class="step step--todo">
  <form class="tick-form" method="post" action="/vehicles/{{ t.vid }}/todos/{{ t.id }}/{% if t.done %}done/undo{% else %}done{% endif %}">
    <input type="hidden" name="back" value="{{ t.back }}">
    <button class="tick" type="submit" aria-pressed="{% if t.done %}true{% else %}false{% endif %}" aria-label="{% if t.done %}Un-tick{% else %}Tick{% endif %}: {{ t.title }}"></button>
  </form>
  <p class="step-text">{{ t.title }}</p>
  {% if !t.done %}
  <div class="step-actions">
    <form method="post" action="/vehicles/{{ t.vid }}/todos/{{ t.id }}/delete">
      <input type="hidden" name="back" value="{{ t.back }}">
      <button class="btn btn--quiet" type="submit" aria-label="Delete to-do: {{ t.title }}">Delete</button>
    </form>
  </div>
  {% endif %}
</li>
