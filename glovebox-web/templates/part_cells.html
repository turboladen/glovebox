<span data-l="Brand">{% if let Some(m) = o.manufacturer %}<span class="vh">Brand </span>{{ m }}{% endif %}</span>
{% if let Some(d) = o.description %}<span class="pn" data-l="Part number"><span class="vh">Part number </span>{{ o.title }}</span><span data-l="Description"><span class="vh">Description </span>{{ d }}</span>{% else %}<span class="pn span2" data-l="Part"><span class="vh">Part </span>{{ o.title }}</span>{% endif %}
<span data-l="Seller">{% if let Some(s) = o.seller %}<span class="vh">Seller </span>{{ s }}{% endif %}</span><span class="num price" data-l="Price">{% if let Some(p) = o.price %}<span class="vh">Price </span>{{ p }}{% endif %}</span>
