<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Glovebox{% endblock %}</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; }
  header, main { max-width: 48rem; margin: 0 auto; padding: 1rem; }
  header { display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; }
  ul { padding-left: 1.25rem; }
</style>
</head>
<body>
<header>
  <a href="/">Glovebox</a>
  {% if let Some(name) = chrome.environment %}<span class="environment">{{ name }}</span>{% endif %}
  <span class="today">{{ chrome.today }}</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
