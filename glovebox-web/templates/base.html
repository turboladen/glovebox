<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}Glovebox{% endblock %}</title>
<style>
  :root {
    color-scheme: light dark;
    --ground: #CFDEDD; --panel: #F3F7F6; --inset: #E3ECEA; --ink: #0E2B31; --label: #46626A;
    --rule: #C6D5D3; --field: #FFFFFF; --field-line: #6F8C91; --accent: #F4BE2C; --on-accent: #0E2B31;
    --ok: #1D7352; --ok-bg: #D3EADB; --wait: #1F5FA8; --wait-bg: #D5E5F6; --bad: #B5341F; --bad-bg: #F7DAD3;
    --plain-bg: #DFE8E6; --focus: var(--ink);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0C262C; --panel: #14353D; --inset: #103039; --ink: #EAF2EF; --label: #9DB9BB;
      --rule: #2A4C55; --field: #0A2126; --field-line: #5E8288; --accent: #F6C544; --on-accent: #0C262C;
      --ok: #7FD6A8; --ok-bg: #1D4A3B; --wait: #8CC2F5; --wait-bg: #1B4062; --bad: #FF8A73; --bad-bg: #5A2B24;
      --plain-bg: #24474F; --focus: var(--accent);
    }
  }

  /* One typeface, one size for data, two weights.
     Gray text is a label. Dark text is a value in the record.
     Only a form field has an outline. A pill is a value from a fixed list. */

  @font-face {
    font-family: "IBM Plex Sans";
    src: url("/assets/plex-sans-400.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("/assets/plex-sans-600.woff2") format("woff2");
    font-weight: 600;
    font-display: swap;
  }

  :root {
    /* The height of a job's sticky head, which a linked need must clear. */
    --sheet-top: 5rem;
    --face: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --s-label: 0.8125rem;
    --s-data: 1rem;
    --s-head: 1.1875rem;
    --s-title: 1.75rem;
    --gap: 0.875rem;
    --pad: 1rem;
    /* Need, Stage, Brand, Part number, Description, Seller, Price, Fit, toggle */
    --cols: 10rem 9rem 7rem 8.5rem minmax(0, 1fr) 5.5rem 5rem 7rem 1.25rem;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 400 var(--s-data)/1.4 var(--face);
    font-variant-numeric: tabular-nums;
  }
  /* A part number mixes letters and digits, so its zero is slashed to tell it
     from the letter O; prices share the ledger's columns and match it. */
  .pn, .price { font-feature-settings: "zero"; }
  h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
  h1, h2, h3, b { font-weight: 600; }
  ul, ol { list-style: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; text-underline-offset: 0.2em; text-decoration-thickness: 1px; }
  /* The ring is the ink on the light theme and the accent on the dark one,
     so it stands 3:1 or more against every ground it can sit on. */
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .page { max-width: 82rem; margin: 0 auto; padding-inline: clamp(0.75rem, 2.5vw, 2rem); }

  /* Labels: column heads, field names, the words before a value. */
  .l, .cols, .field > span, .form-note { font-size: var(--s-label); color: var(--label); font-weight: 400; }

  /* Header */
  .chrome .page { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 1rem; padding-block: 0.75rem 0.25rem; }
  .wordmark { font-weight: 600; text-decoration: none; }
  .chrome nav { margin-inline-start: auto; display: flex; gap: 1rem; }
  .hint { font-size: var(--s-label); color: var(--label); }
  .hint .page { display: block; padding-bottom: 0.5rem; }
  .banner .page > div { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; padding: 0.5rem var(--pad); background: var(--panel); border-radius: 6px; }

  /* Appointment summary: labeled values, like the head of a ledger page. */
  .appt { padding-block: 1.5rem 0.5rem; }
  .appt h1 { font-size: var(--s-title); line-height: 1.15; }
  .summary { display: flex; flex-wrap: wrap; gap: 0.5rem 2.25rem; margin-top: 0.75rem; }
  .summary > div { display: grid; }

  .section { padding-block: 1.25rem 0.5rem; }
  .section > h2 { font-size: var(--s-head); margin-bottom: 0.625rem; }

  /* Pills: each kind of state has its own tint. */
  .pill {
    display: inline-block;
    padding: 0 0.6rem;
    border-radius: 999px;
    background: var(--plain-bg);
    line-height: 1.4;
    white-space: nowrap;
  }
  /* Every pill carries a mark, so no two states differ by color alone:
     a circle for a plain fact, an empty box for something to do, a chevron for
     on its way, a check for settled and a cross for a problem. */
  .pill::before { content: ""; display: inline-block; width: 0.55rem; height: 0.55rem; margin-inline-end: 0.4rem; border: 1.5px solid currentColor; border-radius: 50%; }
  .pill--todo { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .pill--todo::before { border-radius: 1px; }
  .pill--wait { background: var(--wait-bg); }
  .pill--wait::before { width: 0.45rem; height: 0.45rem; margin-inline: 0 0.5rem; border: solid var(--wait); border-width: 2px 2px 0 0; border-radius: 0; transform: translateY(-0.05rem) rotate(45deg); }
  .pill--ok { background: var(--ok-bg); }
  .pill--ok::before { width: 0.34rem; height: 0.62rem; margin-inline: 0.15rem 0.5rem; border: solid var(--ok); border-width: 0 2px 2px 0; border-radius: 0; transform: translateY(-0.08rem) rotate(45deg); }
  .pill--bad { background: var(--bad-bg); font-weight: 600; }
  .pill--bad::before {
    width: 0.62rem; height: 0.62rem; border: 0; border-radius: 0;
    background:
      linear-gradient(45deg, transparent 42%, var(--bad) 42% 58%, transparent 58%),
      linear-gradient(-45deg, transparent 42%, var(--bad) 42% 58%, transparent 58%);
  }
  /* The database name is a standing reminder, not a state. */
  .pill--env { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .pill--env::before { content: none; }
  .empty { color: var(--label); }
  /* Read by a screen reader and not shown. */
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* A sheet: one group of steps, or one job. */
  .sheet { background: var(--panel); border-radius: 6px; margin-bottom: 0.75rem; }
  .sheet-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 0.75rem; padding: 0.625rem var(--pad) 0.5rem; }
  .sheet-head :is(h2, h3) { font-size: var(--s-head); }
  .sheet-head h3 a { text-decoration: none; }
  /* A count is bold, and sits in an accent box when it waits on the owner. */
  .n { font-weight: 600; }
  .n--todo { padding: 0 0.45rem; border-radius: 3px; background: var(--accent); color: var(--on-accent); }
  .sheet-head .n { font-size: var(--s-head); }
  .sheet-head .aside { margin-inline-start: auto; }
  .sheet-head .aside .n { font-size: var(--s-data); }
  .sheet-head .pill { align-self: center; }
  /* The job's name and its column heads stay in view while its rows scroll. */
  .sheet-top { position: sticky; top: 0; z-index: 1; background: var(--panel); border-radius: 6px 6px 0 0; border-bottom: 1px solid var(--rule); }
  .needs > li:first-child { border-top: 0; }
  .need, .need [id] { scroll-margin-top: var(--sheet-top); }
  details.sheet > summary { list-style: none; cursor: pointer; }
  details.sheet > summary::-webkit-details-marker { display: none; }
  details.sheet > summary.sheet-head::after { content: "Show"; margin-inline-start: auto; text-decoration: underline; text-underline-offset: 0.2em; }
  details.sheet[open] > summary.sheet-head::after { content: "Hide"; }

  /* Step rows */
  .step { display: grid; grid-template-columns: 11rem 10rem minmax(0, 1fr) 10.5rem; column-gap: var(--gap); row-gap: 0.5rem; align-items: baseline; padding: 0.5rem var(--pad); border-top: 1px solid var(--rule); }
  .step .key, .row .key { font-weight: 600; }
  .step > .act { justify-self: end; display: flex; gap: 0.5rem 1rem; align-items: baseline; }
  .step > .drawer--end:not([open]) { justify-self: end; }
  .step--todo { grid-template-columns: 1.5rem minmax(0, 1fr) auto; align-items: center; }
  .step > .drawer[open], .step > .more { grid-column: 3 / -1; }
  /* The to-do form opens in the title column. Naming both classes outranks
     the rule above at every width, wherever the two rules sit. */
  .step--todo > .drawer, .step.step--todo > .drawer[open] { grid-column: 2 / -1; }
  /* A first letter is styled only in a block, so a capitalized word that
     sits inside a line is an inline block. A to-do's title is the owner's own
     text ("iPhone mount"), so its row is left as typed. */
  .cap { display: inline-block; }
  .step:not(.step--todo) .say::first-letter, .row .span::first-letter, .cap::first-letter { text-transform: uppercase; }

  /* Ledger rows */
  .cols, .row { display: grid; grid-template-columns: var(--cols); column-gap: var(--gap); padding-inline: var(--pad); align-items: baseline; }
  .cols { padding-block: 0.25rem; border-top: 1px solid var(--rule); }
  .num { text-align: right; }
  .needs > li { border-top: 1px solid var(--rule); }
  .need > summary { list-style: none; cursor: pointer; }
  .need > summary::-webkit-details-marker { display: none; }
  .row { padding-block: 0.5rem; row-gap: 0.25rem; }
  .row .span { grid-column: 3 / 9; }
  .row .qty { color: var(--label); font-weight: 400; margin-inline-start: 0.35rem; }
  .memo { grid-column: 3 / 9; display: flex; flex-wrap: wrap; gap: 0.1rem 1.75rem; }
  /* A label ends with a space, so a screen reader reads it and its value
     as two words; the margin is the rest of the gap. */
  .memo .l { margin-inline-end: 0.2rem; }
  .memo .kit .l { margin-inline-end: 0.4rem; }
  .memo .line { flex-basis: 100%; }
  .toggle { position: relative; width: 1.25rem; height: 1.25rem; align-self: center; }
  .toggle::before, .toggle::after { content: ""; position: absolute; left: 50%; top: 50%; width: 0.75rem; height: 1.5px; background: var(--ink); transform: translate(-50%, -50%); }
  .toggle::after { transform: translate(-50%, -50%) rotate(90deg); }
  .need[open] .toggle::after { display: none; }
  .need[open] { background: var(--inset); }
  .need[open] > summary { box-shadow: inset 3px 0 0 var(--ink); }

  /* Options sit in the same columns as the row they belong to. */
  .opt { cursor: pointer; border-top: 1px solid var(--rule); }
  .opt .pick { justify-self: end; display: flex; align-items: center; gap: 0.5rem; align-self: center; }
  .opt:has(input:checked) { box-shadow: inset 3px 0 0 var(--ink); background: var(--panel); }
  .opt--blocked { cursor: not-allowed; }
  .opt--blocked > span:not(.pick):not(.memo):not(.l) { color: var(--label); }
  @media (width > 76rem) {
    .opt--bad .pn { text-decoration: line-through; }
    .row--wait > .memo { grid-column: 3 / -1; }
  }
  .memo .note { font-weight: 600; }
  .memo .kit { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; }
  .memo .kit .l { grid-column: 1; grid-row: 1; }
  .memo .kit-item { grid-column: 2; }
  .memo .kit-item .pn { margin-left: 0.35rem; }
  .lone { padding: 0.5rem var(--pad) 0.75rem; }
  .work { display: grid; gap: 0.75rem; padding: 0.75rem var(--pad) 1rem; border-top: 1px solid var(--rule); grid-template-columns: var(--cols); column-gap: var(--gap); }
  .work > * { grid-column: 3 / 9; }
  .work > .l { grid-column: 1 / 3; grid-row: 1; }
  .links { display: flex; flex-wrap: wrap; gap: 0.5rem 0.75rem; align-items: start; }
  .links > .drawer[open] { flex-basis: 100%; }

  /* Controls. Solid commits. Outlined opens a form. Underlined is minor. */
  .btn, .drawer > summary {
    display: inline-flex;
    align-items: center;
    min-height: 1.875rem;
    padding: 0.2rem 0.7rem;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    background: var(--ink);
    color: var(--panel);
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    list-style: none;
  }
  .drawer > summary::-webkit-details-marker { display: none; }
  a.btn, .drawer > summary { background: none; color: var(--ink); }
  .btn--quiet, .drawer--quiet > summary { min-height: 1.5rem; padding: 0; border: 0; background: none; color: var(--ink); font-weight: 400; text-decoration: underline; text-underline-offset: 0.2em; }
  .drawer[open] > summary { border-color: transparent; padding-inline: 0; min-height: 0; }
  /* An underlined summary stays a 24-pixel target while its drawer is open. */
  .drawer--quiet[open] > summary { min-height: 1.5rem; }

  .formbox { display: grid; gap: 0.75rem; margin-top: 0.375rem; padding: 0.75rem; border: 1px solid var(--field-line); border-radius: 4px; background: var(--panel); }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 0.625rem 1rem; }
  .field { display: grid; gap: 0.15rem; align-content: start; }
  .form-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; }
  .form-note { max-width: 52ch; }
  input[type="text"], input[type="date"], select, textarea {
    width: 100%;
    min-height: 2.125rem;
    padding: 0.3rem 0.55rem;
    border: 1px solid var(--field-line);
    border-radius: 4px;
    background: var(--field);
  }
  textarea { min-height: 3.5rem; resize: vertical; max-width: 60ch; }
  input[type="radio"], input[type="checkbox"] { appearance: none; flex: none; width: 1.1rem; height: 1.1rem; margin: 0; border: 1.5px solid var(--ink); border-radius: 50%; background: var(--field); }
  input[type="checkbox"] { border-radius: 3px; }
  input[type="radio"]:checked, input[type="checkbox"]:checked { box-shadow: inset 0 0 0 3px var(--field), inset 0 0 0 1rem var(--ink); }
  input[type="radio"]:disabled { border-style: dashed; border-color: var(--label); background: none; }
  .check { display: inline-flex; align-items: center; gap: 0.5rem; }
  /* A pointer target is at least 24 by 24 CSS pixels. */
  .tick { display: block; position: relative; width: 1.5rem; height: 1.5rem; padding: 0; border: 1.5px solid var(--ink); border-radius: 3px; background: var(--field); cursor: pointer; }
  .tick[aria-pressed="true"] { background: var(--ink); }
  .tick[aria-pressed="true"]::after { content: ""; position: absolute; left: 0.46rem; top: 0.16rem; width: 0.35rem; height: 0.7rem; border: solid var(--panel); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  [aria-invalid="true"] { border: 2px solid var(--bad) !important; }
  .error { padding: 0.35rem 0.7rem; border-inline-start: 4px solid var(--bad); background: var(--field); }

  /* A long value wraps inside its own column. */
  .row > span, .step > span { overflow-wrap: anywhere; }
  .span2 { grid-column: span 2; }
  .notice { padding-top: 1rem; }
  .appt > p { margin-top: 0.75rem; }

  /* Home rows: the appointments list. */
  .cols--home, .row--home { grid-template-columns: minmax(0, 1fr) 8rem 8rem minmax(0, 14rem) 4rem 7rem 7rem; }
  /* Waiting rows: the four lists of what is not yet on an appointment share one set of columns. */
  .cols--wait, .row--wait { grid-template-columns: minmax(0, 1fr) 8rem minmax(0, 13rem) minmax(0, 15rem) 8rem 7rem; }
  .cols--wait > .at-key, .row--wait > .at-key { grid-column: 1 / 3; }
  .cols--wait > .at-wide, .row--wait > .at-wide { grid-column: 3; }
  .cols--wait > .at-date, .row--wait > .at-date { grid-column: 5; }
  .cols--wait > .at-job, .row--wait > .at-job { grid-column: 6; }
  /* Shop rows: the directory, a shop's services and its appointments. */
  .cols--shops, .row--shops { grid-template-columns: minmax(0, 1fr) 7rem 8rem 8rem; }
  .cols--visits, .row--visits { grid-template-columns: 7rem minmax(0, 12rem) minmax(0, 1fr) 7rem 7rem; }
  .cols--appts, .row--appts { grid-template-columns: minmax(0, 1fr) minmax(0, 12rem) 7rem 8rem; }
  /* A ledger of rows that do not open sits under a ruled header line. */
  .cols--home, .cols--wait, .cols--shops, .cols--visits, .cols--appts { border-bottom: 1px solid var(--rule); }
  .row--shops .key .l { display: block; }
  .shop-notes { white-space: pre-line; max-width: 60ch; }

  /* Narrow: each row becomes a short list of labeled values. The fixed
     ledger columns take 62rem, so a narrower window than this leaves the
     Description column too little room to read. */
  @media (max-width: 76rem) {
    :root { --sheet-top: 3.5rem; }
    .cols { display: none; }
    .row { grid-template-columns: 7rem minmax(0, 1fr) 1.25rem; }
    .row > [data-l] { grid-column: 1 / 3; display: grid; grid-template-columns: subgrid; }
    .row > [data-l]:empty { display: none; }
    /* Every cell with a value carries a hidden label that a screen reader
       reads at every width, so this visible one has empty alternative text
       and the label is not read twice. A browser that does not know the
       alternative-text form keeps the first declaration. */
    .row > [data-l]::before { content: attr(data-l); content: attr(data-l) / ""; font-size: var(--s-label); color: var(--label); font-weight: 400; }
    .row > [data-l] > .pill, .row > [data-l] > .n { justify-self: start; }
    .row > .key { grid-column: 1 / 3; }
    .row > .toggle { grid-column: 3; grid-row: 1; }
    .row .span, .memo, .work > *, .work > .l { grid-column: 1 / 3; grid-row: auto; }
    .row--home, .row--wait, .row--shops, .row--visits, .row--appts { grid-template-columns: 7rem minmax(0, 1fr); }
    .num { text-align: left; }
    .opt .pick { justify-self: start; }
    .work { grid-template-columns: minmax(0, 1fr); }
    .step { grid-template-columns: minmax(0, 1fr); }
    .step--todo { grid-template-columns: 1.5rem minmax(0, 1fr); }
    .step > .act, .step > .drawer--end:not([open]) { justify-self: start; }
    .step > .drawer[open], .step > .more { grid-column: 1 / -1; }
  }

  /* The work sheet is plain text a mechanic reads on paper, not a panel of
     the ledger; ADR 0009 records why. */
  .ws { padding-block: 1rem 2rem; display: grid; gap: 1.25rem; }
  .ws h1 { font-size: 1.4rem; }
  .ws-car { font-weight: 600; }
  .ws-facts { display: flex; flex-wrap: wrap; gap: 0 1.5rem; }
  .ws-job { break-inside: avoid; display: grid; gap: 0.35rem; }
  .ws-title { display: flex; gap: 0.6rem; align-items: baseline; font-size: 1.15rem; font-weight: 600; }
  .ws-box { flex: none; display: inline-block; width: 0.9em; height: 0.9em; border: 1.5px solid currentColor; }
  .ws-job h2 { font-size: var(--s-data); margin-left: 1.5rem; }
  .ws-job ul { margin-left: 2.5rem; list-style: disc; }
  .ws-job .pn { margin-left: 1rem; }
  .ws-note { display: block; white-space: pre-line; color: var(--label); }
  .ws-job > .ws-note { margin-left: 1.5rem; }
  /* The owner ticks each part, and each item in a kit, while gathering them. */
  .ws-job ul.ws-get, .ws-get ul { list-style: none; }
  .ws-job ul.ws-get { margin-left: 1.5rem; }
  .ws-get li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.15rem 0.6rem; align-items: baseline; }
  .ws-job .ws-get ul { grid-column: 2; margin-left: 0; display: grid; gap: 0.15rem; }
  .ws-warn { background: var(--panel); border: 1px solid var(--rule); padding: 0.75rem 1rem; display: grid; gap: 0.5rem; }
  .ws-warn li { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; align-items: baseline; }
  @media print {
    body:has(.ws) :is(.chrome, .hint), .noprint { display: none; }
    body:has(.ws) { background: #fff; color: #000; }
    .ws { padding: 0; }
    .ws-note, .ws .l { color: #000; }
    .ws a { text-decoration: none; }
  }
</style>
</head>
<body>

<header class="chrome">
  <div class="page">
    <a class="wordmark" href="/">Glovebox</a>
    <span><span class="l">Database </span><span class="pill pill--env" title="{{ chrome.environment_title }}">{{ chrome.environment }}</span></span>
    <nav aria-label="Site"><a href="/">Garage</a> <a href="/shops">Shops</a></nav>
    <span><span class="l">Today </span><time datetime="{{ chrome.today }}">{{ chrome.today }}</time></span>
  </div>
</header>
<p class="hint"><span class="page">To add or change options, prices, part numbers or fitment, ask Claude. This page is for choosing, ordering, receiving and ticking things off.</span></p>
{% block banner %}{% endblock %}
<main>
{% block content %}{% endblock %}
</main>

</body>
</html>
