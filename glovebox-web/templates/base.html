<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}Glovebox{% endblock %}</title>
<style>
  /* One typeface in two weights and four sizes. Black bars and white count
     windows carry the structure; color appears only as a signal. */
  :root {
    color-scheme: light dark;
    --page: #D6D8D6;
    --sheet: #F8F8F6;
    --bar: #161616;
    --on-bar: #F8F8F6;
    --job-bar: #B4B8B6;
    --ink: #161616;
    --ink-2: #565B5C;
    --rule: #C6C9C7;
    --inset: #E9EAE8;
    --amber: #F2A900;
    --on-amber: #161616;
    --green: #1F7A4D;
    --red: #C4241B;
    --invalid: #C4241B;
    --on-signal: #FFFFFF;

    --face: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --s-small: 0.875rem;
    --s-body: 1rem;
    --s-part: 1.1875rem;
    --s-title: 2.125rem;

    --need-col: 12rem;
    --pad: 1rem;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0E0F0F;
      --sheet: #1C1E1F;
      --bar: #000000;
      --on-bar: #F2F2EF;
      --job-bar: #3B3F41;
      --ink: #F2F2EF;
      --ink-2: #A4A9AA;
      --rule: #34383A;
      --inset: #141516;
      --amber: #F2A900;
      --invalid: #E0453A;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { font-size: 100%; -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 400 var(--s-body)/1.45 var(--face);
    font-variant-numeric: tabular-nums;
  }

  h1, h2, h3, h4, p, ul, ol, dl, dd, fieldset { margin: 0; padding: 0; }
  h1, h2, h3, h4, b { font-weight: 700; }
  h2, h3, h4 { font-size: var(--s-body); }
  ul, ol { list-style: none; }
  fieldset { border: 0; min-width: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }

  a { color: inherit; text-underline-offset: 0.2em; }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  .page { max-width: 72rem; margin: 0 auto; padding-inline: clamp(0.75rem, 3vw, 2.5rem); }

  /* Header */

  .chrome { background: var(--bar); color: var(--on-bar); }
  .chrome .page { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 1rem; padding-block: 0.75rem; }
  .wordmark { font-weight: 700; text-decoration: none; }
  .chrome nav { margin-inline-start: auto; }
  .today { color: var(--on-bar); }

  /* Tags: every value that comes from a fixed list. A solid tag is a signal;
     an outlined tag states a fact that needs no attention. */

  .pill, .env {
    display: inline-block;
    width: fit-content;
    padding: 0.1rem 0.45rem;
    border: 1px solid var(--ink-2);
    border-radius: 2px;
    font-size: var(--s-small);
    line-height: 1.35;
    white-space: nowrap;
  }
  .env, .pill--undecided, .pill--to_order, .fit--unconfirmed {
    background: var(--amber); border-color: var(--amber); color: var(--on-amber); font-weight: 700;
  }
  .pill--received, .pill--installed, .pill--done {
    background: var(--green); border-color: var(--green); color: var(--on-signal); font-weight: 700;
  }
  .fit--does_not_fit, .pill--rejected {
    background: var(--red); border-color: var(--red); color: var(--on-signal); font-weight: 700;
  }
  .pill--ordered { background: var(--ink); border-color: var(--ink); color: var(--sheet); font-weight: 700; }
  .pill--none { border-style: dashed; color: var(--ink-2); }

  .tag { color: var(--ink-2); font-size: var(--s-small); white-space: nowrap; }

  /* Undo banner */

  .banner { background: var(--sheet); border-bottom: 1px solid var(--rule); }
  .banner .page { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; padding-block: 0.5rem; }

  /* Appointment */

  .appt { padding-block: 2.25rem 0.75rem; }
  .appt h1 { font-size: var(--s-title); line-height: 1.1; letter-spacing: -0.015em; }
  .appt p { margin-top: 0.5rem; }
  .appt .pill { margin-inline-start: 0.5rem; vertical-align: 0.1em; }

  /* Sections and bars */

  .section { display: grid; gap: 0.75rem; padding-block: 1.5rem 1rem; }
  .section > * { min-width: 0; }
  .section > h2 { font-size: var(--s-part); }

  .box { background: var(--sheet); }
  .box-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.25rem 0.625rem;
    padding: 0.5rem var(--pad);
    background: var(--bar);
    color: var(--on-bar);
  }
  /* The count sits in a window cut into the bar. */
  .box-head .count {
    min-width: 1.75rem;
    padding: 0 0.4rem;
    border-radius: 2px;
    background: var(--on-bar);
    color: var(--bar);
    font-weight: 700;
    text-align: center;
  }
  .tone-red > .box-head .count, .tone-amber > .box-head .count { background: var(--amber); color: var(--on-amber); }
  .tone-red > .box-head .count { background: var(--red); color: var(--on-signal); }

  details.box > summary { list-style: none; cursor: pointer; }
  details.box > summary::-webkit-details-marker { display: none; }
  details.box > summary .box-head::after { content: "Show"; margin-inline-start: auto; font-weight: 400; text-decoration: underline; text-underline-offset: 0.2em; }
  details.box[open] > summary .box-head::after { content: "Hide"; }

  .job > .box-head { background: var(--job-bar); color: var(--ink); }
  .job > .box-head .count { margin-inline-start: auto; min-width: 0; padding: 0; background: none; color: inherit; font-weight: 400; }
  .job-head .pill { border-color: var(--ink); }

  /* Next-step rows */

  .step {
    display: grid;
    grid-template-columns: var(--need-col) minmax(0, 1fr) auto;
    column-gap: 1rem;
    row-gap: 0.5rem;
    align-items: center;
    padding: 0.625rem var(--pad);
  }
  .step + .step { border-top: 1px solid var(--rule); }
  .step-need { font-weight: 700; }
  .step-text { overflow-wrap: anywhere; }
  .step-text::first-letter { text-transform: uppercase; }
  .step-text .tag, .step-text .pill { margin-inline-start: 0.625rem; }
  .step-actions { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; justify-content: flex-end; align-items: center; }
  .step-actions > form { display: contents; }
  .step > .drawer[open] { grid-column: 2 / -1; }
  .step > .drawer:not([open]) { justify-self: end; }
  .step--todo { grid-template-columns: 1.375rem minmax(0, 1fr) auto; }
  .step > .drawer--aside, .step > .drawer--aside:not([open]),
  .step > .drawer--add, .step > .drawer--add:not([open]) { grid-column: 2 / -1; justify-self: start; }
  .step > .drawer--aside { margin-top: -0.375rem; }

  /* Controls: a solid button commits something; underlined text does the rest. */

  .btn, .drawer > summary {
    display: inline-flex;
    align-items: center;
    min-height: 2rem;
    padding: 0.3rem 0.75rem;
    border: 0;
    border-radius: 2px;
    background: var(--ink);
    color: var(--sheet);
    font-size: var(--s-small);
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    list-style: none;
  }
  .drawer > summary::-webkit-details-marker { display: none; }
  .btn--quiet, .drawer--aside > summary, .drawer--add > summary, .secondary .drawer > summary {
    min-height: 0;
    padding: 0;
    background: none;
    color: var(--ink);
    font-weight: 400;
    text-decoration: underline;
    text-underline-offset: 0.2em;
  }
  .drawer[open] > summary { background: none; color: var(--ink); padding-inline: 0; }

  .tick {
    display: block;
    position: relative;
    width: 1.375rem;
    height: 1.375rem;
    padding: 0;
    border: 2px solid var(--ink);
    border-radius: 2px;
    background: var(--sheet);
    cursor: pointer;
  }
  .tick[aria-pressed="true"] { background: var(--green); border-color: var(--green); }
  .tick[aria-pressed="true"]::after {
    content: "";
    position: absolute;
    left: 0.36rem;
    top: 0.06rem;
    width: 0.35rem;
    height: 0.7rem;
    border: solid var(--on-signal);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .form { display: grid; gap: 0.875rem; margin-top: 0.5rem; padding: 0.875rem; background: var(--inset); }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 0.75rem 1rem; }
  .field { display: grid; gap: 0.2rem; align-content: start; }
  .field > span, .need-cols, .form-note, .opt-meta, .fit-note { font-size: var(--s-small); color: var(--ink-2); }
  .form-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1rem; }
  .form-note { max-width: 48ch; }

  input[type="text"], input[type="date"], select, textarea {
    width: 100%;
    min-height: 2.25rem;
    padding: 0.35rem 0.6rem;
    border: 1px solid var(--ink-2);
    border-radius: 2px;
    background: var(--sheet);
  }
  textarea { min-height: 4rem; resize: vertical; max-width: 60ch; }
  input[type="radio"], input[type="checkbox"] { accent-color: var(--ink); width: 1.05rem; height: 1.05rem; margin: 0; }
  .check { display: inline-flex; align-items: center; gap: 0.5rem; }

  [aria-invalid="true"] { border: 2px solid var(--invalid) !important; }
  .error { padding: 0.4rem 0.75rem; background: var(--red); color: var(--on-signal); overflow-wrap: anywhere; }

  /* Jobs */

  .need-cols, .need-row {
    display: grid;
    grid-template-columns: var(--need-col) minmax(0, 1fr) minmax(0, 17rem) 1.25rem;
    column-gap: 1.5rem;
    padding-inline: var(--pad);
  }
  .need-cols { padding-block: 0.3rem; border-bottom: 1px solid var(--rule); }

  .needs > li + li { border-top: 1px solid var(--rule); }
  .need > summary { list-style: none; cursor: pointer; }
  .need > summary::-webkit-details-marker { display: none; }
  .need[open] { box-shadow: inset 4px 0 0 var(--ink); }

  .need-row { row-gap: 0.75rem; padding-block: 0.875rem; }
  .need-row .cell > * { display: block; }
  .need-row .cell > .pill, .need-stage { margin-top: 0.35rem; }
  .need-name { font-weight: 700; }

  .pn { font-size: var(--s-part); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
  .pn .mfr { font-size: var(--s-body); font-weight: 400; margin-inline-end: 0.45rem; }
  .money { font-weight: 700; color: var(--ink); white-space: nowrap; }
  .none { color: var(--ink-2); }
  .need-note { font-size: var(--s-small); font-weight: 700; }
  .purchase { margin-top: 0.35rem; font-size: var(--s-small); }

  .facts { display: grid; gap: 0.4rem; align-content: start; }
  .kinds { display: flex; flex-wrap: wrap; gap: 0.375rem; }

  .marker { position: relative; width: 1.25rem; height: 1.25rem; margin-top: 0.1rem; }
  .marker::before, .marker::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0.75rem;
    height: 2px;
    background: var(--ink);
    transform: translate(-50%, -50%);
  }
  .marker::after { transform: translate(-50%, -50%) rotate(90deg); }
  .need[open] .marker::after { display: none; }

  .need-body {
    display: grid;
    gap: 0.875rem;
    padding: 0 var(--pad) 1.25rem calc(var(--pad) + var(--need-col) + 1.5rem);
  }
  .need-body .form { margin-top: 0; }
  legend { padding: 0; }

  .opts { margin-top: 0.375rem; background: var(--sheet); }
  .opt {
    display: grid;
    grid-template-columns: 1.5rem minmax(0, 1fr) 6rem minmax(0, 15rem);
    column-gap: 1rem;
    row-gap: 0.25rem;
    align-items: baseline;
    padding: 0.625rem 0.75rem;
    cursor: pointer;
  }
  .opt + .opt { border-top: 1px solid var(--rule); }
  .opt:has(input:checked) { box-shadow: inset 4px 0 0 var(--ink); }
  .opt input { align-self: start; margin-top: 0.3rem; }
  .opt .price { text-align: right; }
  .opt--blocked { cursor: not-allowed; }
  .opt--blocked .pn, .opt--blocked .opt-desc, .opt--blocked .money { color: var(--ink-2); }
  .opt--does_not_fit .pn { text-decoration: line-through; }
  .opt .fit-note { display: block; margin-top: 0.3rem; }

  .secondary { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; align-items: start; }
  .secondary > .drawer[open] { flex-basis: 100%; }

  /* Narrow widths */

  @media (max-width: 60rem) {
    :root { --need-col: 10rem; }
    .need-cols { display: none; }
    .need-row { grid-template-columns: var(--need-col) minmax(0, 1fr) 1.25rem; }
    .need-row .facts { grid-column: 2 / 3; }
    .need-row .marker { grid-column: 3; grid-row: 1; }
  }

  @media (max-width: 46rem) {
    .step { grid-template-columns: minmax(0, 1fr); }
    .step--todo { grid-template-columns: 1.375rem minmax(0, 1fr); }
    .step-actions, .step > .drawer:not([open]) { justify-self: start; justify-content: flex-start; }
    .step > .drawer, .step > .drawer[open], .step > .drawer--aside, .step > .drawer--add { grid-column: 1 / -1; }
    .need-row { grid-template-columns: minmax(0, 1fr) 1.25rem; }
    .need-row > * { grid-column: 1; }
    .need-row .facts { grid-column: 1; }
    .need-row .marker { grid-column: 2; grid-row: 1; }
    .need-body { padding-inline-start: var(--pad); }
    .opt { grid-template-columns: 1.5rem minmax(0, 1fr); }
    .opt > :nth-child(n+3) { grid-column: 2; }
    .opt .price { text-align: left; }
  }

  /* Home and error pages */

  .plain { padding-block: 1.5rem 2rem; display: grid; gap: 1rem; }
  .plain h1 { font-size: var(--s-title); line-height: 1.1; }
  .plain h2 { font-size: var(--s-part); }
  .plain li + li { margin-top: 0.4rem; }
  .plain .vehicle { display: grid; gap: 0.6rem; }
  .notice { padding-top: 1.5rem; }
  .crumbs { padding-top: 1.5rem; }
</style>
</head>
<body>

<header class="chrome">
  <div class="page">
    <a class="wordmark" href="/">Glovebox</a>
    {% if let Some(name) = chrome.environment %}<span class="env" title="This is the {{ name }} database">{{ name }}</span>{% endif %}
    <nav aria-label="Site"><a href="/">Garage</a></nav>
    <time class="today" datetime="{{ chrome.today }}">{{ chrome.today }}</time>
  </div>
</header>
{% block banner %}{% endblock %}
<main>
{% block content %}{% endblock %}
</main>

</body>
</html>
