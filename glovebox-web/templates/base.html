<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}Glovebox{% endblock %}</title>
<style>
  :root {
    color-scheme: light dark;
    --ground: #CFDEDD; --panel: #F3F7F6; --inset: #E3ECEA; --ink: #0E2B31; --label: #4A666C;
    --rule: #C6D5D3; --field: #FFFFFF; --field-line: #6F8C91; --accent: #F4BE2C; --on-accent: #0E2B31;
    --ok: #1D7352; --ok-bg: #D3EADB; --wait: #1F5FA8; --wait-bg: #D5E5F6; --bad: #B5341F; --bad-bg: #F7DAD3;
    --plain-bg: #DFE8E6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0C262C; --panel: #14353D; --inset: #103039; --ink: #EAF2EF; --label: #9DB9BB;
      --rule: #2A4C55; --field: #0A2126; --field-line: #5E8288; --accent: #F6C544; --on-accent: #0C262C;
      --ok: #7FD6A8; --ok-bg: #1D4A3B; --wait: #8CC2F5; --wait-bg: #1B4062; --bad: #FF8A73; --bad-bg: #5A2B24;
      --plain-bg: #24474F;
    }
  }

  /* One typeface, one size for data, two weights.
     Gray text is a label. Dark text is a value in the record.
     Only a form field has a box. A filled tag needs the owner. */

  @font-face {
    font-family: "IBM Plex Sans";
    src: url("/assets/plex-sans-400.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("/assets/plex-sans-600.woff2") format("woff2");
    font-weight: 600;
    font-display: swap;
  }

  :root {
    --face: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --s-label: 0.8125rem;
    --s-data: 1rem;
    --s-head: 1.1875rem;
    --s-title: 1.75rem;
    --gap: 0.875rem;
    --pad: 1rem;
    /* Need, Stage, Brand, Part number, Description, Seller, Price, Fit, toggle */
    --cols: 10rem 9rem 7rem 8.5rem minmax(0, 1fr) 5.5rem 5rem 7rem 1.25rem;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 400 var(--s-data)/1.4 var(--face);
    font-variant-numeric: tabular-nums;
    font-feature-settings: "zero";
  }
  h1, h2, h3, h4, p, ul, ol, dl, dd, fieldset { margin: 0; padding: 0; }
  h1, h2, h3, h4, b { font-weight: 600; }
  ul, ol { list-style: none; }
  fieldset { border: 0; min-width: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; text-underline-offset: 0.2em; text-decoration-thickness: 1px; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .page { max-width: 82rem; margin: 0 auto; padding-inline: clamp(0.75rem, 2.5vw, 2rem); }

  /* Labels: column heads, field names, the words before a value. */
  .l, .cols, .field > span, .form-note { font-size: var(--s-label); color: var(--label); font-weight: 400; }

  /* Header */
  .chrome .page { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 1rem; padding-block: 0.75rem 0.25rem; }
  .wordmark { font-weight: 600; text-decoration: none; }
  .chrome nav { margin-inline-start: auto; }
  .hint { font-size: var(--s-label); color: var(--label); }
  .hint .page { display: block; padding-bottom: 0.5rem; }
  .banner .page > div { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; padding: 0.5rem var(--pad); background: var(--panel); border-radius: 6px; }

  /* Appointment summary: labeled values, like the head of a ledger page. */
  .appt { padding-block: 1.5rem 0.5rem; }
  .appt h1 { font-size: var(--s-title); line-height: 1.15; }
  .summary { display: flex; flex-wrap: wrap; gap: 0.5rem 2.25rem; margin-top: 0.75rem; }
  .summary > div { display: grid; }

  .section { padding-block: 1.25rem 0.5rem; }
  .section > h2 { font-size: var(--s-head); margin-bottom: 0.625rem; }

  /* Tags. Filled: needs the owner. Marked: a problem. Everything else is plain text. */
  .pill {
    display: inline-block;
    padding: 0 0.6rem;
    border-radius: 999px;
    background: var(--plain-bg);
    line-height: 1.4;
    white-space: nowrap;
  }
  /* Every pill carries a mark, so no two states differ by color alone:
     a circle for a plain fact, an empty box for something to do, a chevron for
     on its way, a check for settled and a cross for a problem. */
  .pill::before { content: ""; display: inline-block; width: 0.55rem; height: 0.55rem; margin-inline-end: 0.4rem; border: 1.5px solid currentColor; border-radius: 50%; }
  .pill--undecided, .pill--to_order, .fit--unconfirmed { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .pill--undecided::before, .pill--to_order::before, .fit--unconfirmed::before { border-radius: 1px; }
  .pill--ordered { background: var(--wait-bg); }
  .pill--ordered::before { width: 0.45rem; height: 0.45rem; margin-inline: 0 0.5rem; border: solid var(--wait); border-width: 2px 2px 0 0; border-radius: 0; transform: translateY(-0.05rem) rotate(45deg); }
  .pill--received, .pill--installed, .pill--shop_supplies, .pill--done, .fit--confirmed { background: var(--ok-bg); }
  .pill--received::before, .pill--installed::before, .pill--shop_supplies::before, .pill--done::before, .fit--confirmed::before { width: 0.34rem; height: 0.62rem; margin-inline: 0.15rem 0.5rem; border: solid var(--ok); border-width: 0 2px 2px 0; border-radius: 0; transform: translateY(-0.08rem) rotate(45deg); }
  .fit--does_not_fit, .pill--rejected { background: var(--bad-bg); font-weight: 600; }
  .fit--does_not_fit::before, .pill--rejected::before {
    width: 0.62rem; height: 0.62rem; border: 0; border-radius: 0;
    background:
      linear-gradient(45deg, transparent 42%, var(--bad) 42% 58%, transparent 58%),
      linear-gradient(-45deg, transparent 42%, var(--bad) 42% 58%, transparent 58%);
  }
  /* The database name is a standing reminder, not a state. */
  .pill--env { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .pill--env::before { content: none; }
  .empty { color: var(--label); }

  /* A sheet: one group of steps, or one job. */
  .sheet { background: var(--panel); border-radius: 6px; margin-bottom: 0.75rem; }
  .sheet-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 0.75rem; padding: 0.625rem var(--pad) 0.5rem; }
  .sheet-head h3 { font-size: var(--s-head); }
  .sheet-head h3 a { text-decoration: none; }
  .sheet-head .n { font-size: var(--s-head); font-weight: 600; }
  .sheet--todo .sheet-head .n { padding: 0 0.45rem; border-radius: 3px; background: var(--accent); color: var(--on-accent); }
  .sheet-head .aside { margin-inline-start: auto; }
  .sheet-head .aside .n { font-size: var(--s-data); }
  .sheet-head .aside--todo .n { padding: 0 0.45rem; border-radius: 3px; background: var(--accent); color: var(--on-accent); }
  .sheet-head .pill { align-self: center; }
  /* The job's name and its column heads stay in view while its rows scroll. */
  .sheet-top { position: sticky; top: 0; z-index: 1; background: var(--panel); border-radius: 6px 6px 0 0; border-bottom: 1px solid var(--rule); }
  .needs > li:first-child { border-top: 0; }
  .need, .need [id] { scroll-margin-top: 5rem; }
  details.sheet > summary { list-style: none; cursor: pointer; }
  details.sheet > summary::-webkit-details-marker { display: none; }
  details.sheet > summary .sheet-head::after { content: "Show"; margin-inline-start: auto; text-decoration: underline; text-underline-offset: 0.2em; }
  details.sheet[open] > summary .sheet-head::after { content: "Hide"; }

  /* Step rows */
  .step { display: grid; grid-template-columns: 11rem 10rem minmax(0, 1fr) 10.5rem; column-gap: var(--gap); row-gap: 0.5rem; align-items: baseline; padding: 0.5rem var(--pad); border-top: 1px solid var(--rule); }
  .step .key, .row .key { font-weight: 600; }
  .step > span.act { justify-self: end; display: flex; gap: 0.5rem 1rem; align-items: baseline; }
  .step > .drawer--end:not([open]) { justify-self: end; }
  .step--todo { grid-template-columns: 1.375rem minmax(0, 1fr) auto; align-items: center; }
  .step > .drawer[open], .step > .formbox { grid-column: 3 / -1; }
  .step > .more { grid-column: 3 / -1; }

  /* Ledger rows */
  .cols, .row { display: grid; grid-template-columns: var(--cols); column-gap: var(--gap); padding-inline: var(--pad); align-items: baseline; }
  .cols { padding-block: 0.25rem; border-top: 1px solid var(--rule); }
  .num { text-align: right; }
  .needs > li { border-top: 1px solid var(--rule); }
  .need > summary { list-style: none; cursor: pointer; }
  .need > summary::-webkit-details-marker { display: none; }
  .row { padding-block: 0.5rem; row-gap: 0.25rem; }
  .row .span { grid-column: 3 / 9; }
  .row .qty { color: var(--label); font-weight: 400; margin-inline-start: 0.35rem; }
  .memo { grid-column: 3 / 9; display: flex; flex-wrap: wrap; gap: 0.1rem 1.75rem; }
  .memo .l { margin-inline-end: 0.4rem; }
  .memo .line { flex-basis: 100%; }
  .toggle { position: relative; width: 1.25rem; height: 1.25rem; align-self: center; }
  .toggle::before, .toggle::after { content: ""; position: absolute; left: 50%; top: 50%; width: 0.75rem; height: 1.5px; background: var(--ink); transform: translate(-50%, -50%); }
  .toggle::after { transform: translate(-50%, -50%) rotate(90deg); }
  .need[open] .toggle::after { display: none; }
  .need[open] { background: var(--inset); }
  .need[open] > summary { box-shadow: inset 3px 0 0 var(--ink); }

  /* Options sit in the same columns as the row they belong to. */
  .opt { cursor: pointer; border-top: 1px solid var(--rule); }
  .opt .pick { justify-self: end; display: flex; align-items: center; gap: 0.5rem; align-self: center; }
  .opt:has(input:checked) { box-shadow: inset 3px 0 0 var(--ink); background: var(--panel); }
  .opt--blocked { cursor: not-allowed; }
  .opt--blocked > span:not(.pick):not(.memo):not(.l) { color: var(--label); }
  .opt--does_not_fit .pn { text-decoration: line-through; }
  .memo .note { font-weight: 600; }
  .lone { padding: 0.5rem var(--pad) 0.75rem; }
  .work { display: grid; gap: 0.75rem; padding: 0.75rem var(--pad) 1rem; border-top: 1px solid var(--rule); grid-template-columns: var(--cols); column-gap: var(--gap); }
  .work > * { grid-column: 3 / 9; }
  .work > .l { grid-column: 1 / 3; grid-row: 1; }
  .links { display: flex; flex-wrap: wrap; gap: 0.5rem 0.75rem; align-items: start; }
  .links > .drawer[open] { flex-basis: 100%; }

  /* Controls. Solid commits. Outlined opens a form. Underlined is minor. */
  .btn, .drawer > summary {
    display: inline-flex;
    align-items: center;
    min-height: 1.875rem;
    padding: 0.2rem 0.7rem;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    background: var(--ink);
    color: var(--panel);
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    list-style: none;
  }
  .drawer > summary::-webkit-details-marker { display: none; }
  a.btn, .drawer > summary { background: none; color: var(--ink); }
  .btn--quiet, .drawer--quiet > summary { min-height: 0; padding: 0; border: 0; background: none; color: var(--ink); font-weight: 400; text-decoration: underline; text-underline-offset: 0.2em; }
  .drawer[open] > summary { border-color: transparent; padding-inline: 0; min-height: 0; }

  .formbox { display: grid; gap: 0.75rem; margin-top: 0.375rem; padding: 0.75rem; border: 1px solid var(--field-line); border-radius: 4px; background: var(--panel); }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 0.625rem 1rem; }
  .field { display: grid; gap: 0.15rem; align-content: start; }
  .form-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; }
  .form-note { max-width: 52ch; }
  input[type="text"], input[type="date"], select, textarea {
    width: 100%;
    min-height: 2.125rem;
    padding: 0.3rem 0.55rem;
    border: 1px solid var(--field-line);
    border-radius: 4px;
    background: var(--field);
  }
  textarea { min-height: 3.5rem; resize: vertical; max-width: 60ch; }
  input[type="radio"], input[type="checkbox"] { appearance: none; flex: none; width: 1.1rem; height: 1.1rem; margin: 0; border: 1.5px solid var(--ink); border-radius: 50%; background: var(--field); }
  input[type="checkbox"] { border-radius: 3px; }
  input[type="radio"]:checked { box-shadow: inset 0 0 0 3px var(--field), inset 0 0 0 1rem var(--ink); }
  input[type="radio"]:disabled { border-style: dashed; border-color: var(--label); background: none; }
  .check { display: inline-flex; align-items: center; gap: 0.5rem; }
  .tick { display: block; position: relative; width: 1.375rem; height: 1.375rem; padding: 0; border: 1.5px solid var(--ink); border-radius: 3px; background: var(--field); cursor: pointer; }
  .tick[aria-pressed="true"] { background: var(--ink); }
  .tick[aria-pressed="true"]::after { content: ""; position: absolute; left: 0.4rem; top: 0.1rem; width: 0.35rem; height: 0.7rem; border: solid var(--panel); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  [aria-invalid="true"] { border: 2px solid var(--bad) !important; }
  .error { padding: 0.35rem 0.7rem; border-inline-start: 4px solid var(--bad); background: var(--field); }

  /* Narrow: each row becomes a short list of labeled values. */
  @media (max-width: 68rem) {
    .cols { display: none; }
    .row { grid-template-columns: 7rem minmax(0, 1fr) 1.25rem; }
    .row > [data-l] { grid-column: 1 / 3; display: grid; grid-template-columns: subgrid; }
    .row > [data-l]::before { content: attr(data-l); font-size: var(--s-label); color: var(--label); font-weight: 400; }
    .row > .key { grid-column: 1 / 3; }
    .row > .toggle { grid-column: 3; grid-row: 1; }
    .row .span, .memo, .work > *, .work > .l { grid-column: 1 / 3; grid-row: auto; }
    .num { text-align: left; }
    .opt .pick { justify-self: start; }
    .work { grid-template-columns: minmax(0, 1fr); }
    .step { grid-template-columns: minmax(0, 1fr); }
    .step--todo { grid-template-columns: 1.375rem minmax(0, 1fr); }
    .step > span.act { justify-self: start; }
    .step > .drawer[open], .step > .formbox, .step > .more { grid-column: 1 / -1; }
  }

  /* A long value wraps inside its own column. */
  .row > span, .step > span { overflow-wrap: anywhere; }
  .span2 { grid-column: span 2; }
  .cap::first-letter { text-transform: uppercase; }
  .step--todo > .drawer, .step--todo > .drawer[open] { grid-column: 2 / -1; }
  .notice { padding-top: 1rem; }
  .appt > p { margin-top: 0.75rem; }
  .step--home { grid-template-columns: minmax(0, 1.4fr) 10rem minmax(0, 1fr) minmax(0, 1fr); }
  .step--home a { text-underline-offset: 0.2em; }
  @media (max-width: 68rem) {
    .step--home { grid-template-columns: minmax(0, 1fr); }
    .step > .drawer--end:not([open]) { justify-self: start; }
    .row > .key { display: block; }
    .row > .key::before { content: none; }
    .row > [data-l] > .pill { justify-self: start; }
    .opt--does_not_fit .pn { text-decoration: none; }
  }
  .row .span::first-letter, .step .say::first-letter { text-transform: uppercase; }
</style>
</head>
<body>

<header class="chrome">
  <div class="page">
    <a class="wordmark" href="/">Glovebox</a>
    <span><span class="l">Database </span><span class="pill pill--env" title="{{ chrome.environment_title }}">{{ chrome.environment }}</span></span>
    <nav aria-label="Site"><a href="/">Garage</a></nav>
    <span><span class="l">Today </span><time datetime="{{ chrome.today }}">{{ chrome.today }}</time></span>
  </div>
</header>
<p class="hint"><span class="page">To add or change options, prices, part numbers or fitment, ask Claude. This page is for choosing, ordering, receiving and ticking things off.</span></p>
{% block banner %}{% endblock %}
<main>
{% block content %}{% endblock %}
</main>

</body>
</html>
