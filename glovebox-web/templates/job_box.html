<article class="sheet" aria-labelledby="job-{{ j.id }}">
  <div class="sheet-top">
    <header class="sheet-head">
      <h3 id="job-{{ j.id }}"><a href="/vehicles/{{ j.vid }}/jobs/{{ j.id }}">{{ j.title }}</a></h3>
      <span class="pill pill--{{ j.status_class }}">{{ j.status_text }}</span>
      <span class="aside{% if j.open.n > 0 %} aside--todo{% endif %}"><span class="n">{{ j.open.n }}</span> {{ j.open.text }}</span>
    </header>
    {% if !j.needs.is_empty() %}
    <div class="cols" aria-hidden="true"><span>Need</span><span>Stage</span><span>Brand</span><span>Part number</span><span>Description</span><span>Seller</span><span class="num">Price</span><span>Fit</span><span></span></div>
    {% endif %}
  </div>
  {% if j.needs.is_empty() %}
  <p class="empty lone">No needs yet.</p>
  {% else %}
  <ul class="needs">
    {% for n in j.needs %}{% include "need_row.html" %}{% endfor %}
  </ul>
  {% endif %}
</article>
