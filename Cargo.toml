[workspace]
resolver = "3"
members = ["glovebox-shared", "glovebox-mcp", "glovebox-cli", "glovebox-web"]

[workspace.package]
edition = "2024"
version = "0.1.0"

# Every crate denies clippy's pedantic group. The CI gate adds `--all-targets`
# (tests) and `-D warnings` (rustc warnings and unfulfilled expectations).
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

# A public doc that links to a private item, or to nothing, is an error in every
# crate, so a local `cargo doc` stops on it as the CI gate does.
[workspace.lints.rustdoc]
private_intra_doc_links = "deny"
broken_intra_doc_links = "deny"

[workspace.dependencies]
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
async-trait = "0.1"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
askama = "0.16"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
schemars = "1.2"
uom = { version = "0.38", default-features = false, features = ["f64", "si", "std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
