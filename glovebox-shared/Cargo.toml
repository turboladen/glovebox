[package]
name = "glovebox-shared"
edition.workspace = true
version.workspace = true

[lib]
name = "glovebox_shared"
path = "src/lib.rs"

[features]
# Exposes `test_support` (in-memory migrated DB) to sibling crates' tests.
# Enable only as a dev-dependency feature; never from a normal dependency.
test-support = []
# Derives `schemars::JsonSchema` for the vocabulary enums, so a tool schema lists
# their values. `glovebox-mcp` enables it.
schemars = ["dep:schemars"]

[dependencies]
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
thiserror.workspace = true
reqwest.workspace = true
async-trait.workspace = true
tracing.workspace = true
schemars = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
