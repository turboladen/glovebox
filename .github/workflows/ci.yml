name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on a PR branch, but let push-to-main runs finish so no
# main commit ever records a cancelled check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  # Decide whether the change touches code. Docs-only / beads-only / markdown-only
  # changes skip the heavy build jobs. This is also how CI stays beads-independent:
  # .beads/ is excluded here and bd is never invoked anywhere in CI.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**/*'
              - '!**/*.md'
              - '!.beads/**'
              - '!docs/**'
              - '!.gitignore'

  # rustfmt uses nightly-only options (see rustfmt.toml), so the format gate runs
  # on the nightly toolchain.
  format:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Format check
        run: just fmt-check

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Layering gate (no axum or rmcp in shared)
        run: just check-layering
      - name: Build, test, clippy
        run: just ci-backend

  # Single required status check for branch protection. Passes when every needed
  # job succeeded or was skipped (docs-only change); fails if any failed/cancelled.
  all-checks:
    needs: [changes, format, backend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
          echo "All required jobs passed (or were skipped for a non-code change)."
