name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on a PR branch, but let push-to-main runs finish so no
# main commit ever records a cancelled check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  # Decide whether the change touches code. Docs-only / beads-only / markdown-only
  # changes skip the heavy build jobs. This is also how CI stays beads-independent:
  # .beads/ is excluded here and bd is never invoked anywhere in CI.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**/*'
              - '!**/*.md'
              - '!.beads/**'
              - '!docs/**'
              - '!.gitignore'

  # rustfmt uses nightly-only options (see rustfmt.toml), so the format gate runs
  # on a nightly toolchain. The date is pinned so a rustfmt change cannot turn an
  # unchanged tree red; move it when the local nightly that `just fmt` uses moves.
  format:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GLOVEBOX_NIGHTLY: nightly-2026-10-03
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.GLOVEBOX_NIGHTLY }}
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Format check
        run: just fmt-check

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Layering gate (no axum or rmcp in shared)
        run: just check-layering
      - name: Clippy, docs, build, test
        run: just ci-backend

  # US-English spell-check over the whole tree, config in .typos.toml. It runs
  # on docs-only changes too, since prose is most of what it checks.
  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Pinned so a new dictionary release cannot turn an unchanged tree red;
      # keep it in step with the version `just typos` runs locally.
      - uses: taiki-e/install-action@v2
        with:
          tool: typos@1.50.3
      - run: typos

  # RustSec advisories for the locked dependencies. `.cargo/audit.toml` lists
  # the accepted ones.
  audit:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-audit
      - run: just audit

  # Single required status check for branch protection. Passes when every needed
  # job succeeded or was skipped (docs-only change); fails if any failed/cancelled.
  all-checks:
    needs: [changes, format, backend, typos, audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
          echo "All required jobs passed (or were skipped for a non-code change)."
